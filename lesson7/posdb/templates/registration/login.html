<!-- templates/registration/login.html -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Login — POS</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            color: #2d3748;
        }

        .login-container {
            background: white;
            padding: 40px 48px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 400px;
            position: relative;
            overflow: hidden;
        }

        .login-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #2b6cb0, #276749);
        }

        .logo-section {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo {
            font-size: 3em;
            margin-bottom: 8px;
        }

        h1 {
            color: #1a202c;
            margin-bottom: 8px;
            text-align: center;
            font-size: 1.8em;
            font-weight: 600;
        }

        .subtitle {
            color: #718096;
            text-align: center;
            font-size: 1em;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            font-weight: 600;
            display: block;
            margin-bottom: 6px;
            color: #2d3748;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1em;
            transition: all 0.2s;
            background: #f8fafc;
        }

        input:focus {
            outline: none;
            border-color: #2b6cb0;
            background: white;
            box-shadow: 0 0 0 3px rgba(43, 108, 176, 0.1);
        }

        .btn {
            margin-top: 24px;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #2b6cb0 0%, #2c5282 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.05em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(43, 108, 176, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .errors {
            color: #c53030;
            font-size: 0.88em;
            margin-top: 16px;
            padding: 12px;
            background: #fed7d7;
            border-radius: 6px;
            border-left: 4px solid #c53030;
        }

        .footer {
            text-align: center;
            margin-top: 24px;
            color: #a0aec0;
            font-size: 0.9em;
        }

        .footer a {
            color: #2b6cb0;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 32px 24px;
                margin: 20px;
                max-width: none;
            }

            h1 {
                font-size: 1.5em;
            }

            .logo {
                font-size: 2.5em;
            }
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="logo-section">
            <div class="logo">🛒</div>
            <h1>POS Staff Login</h1>
            <div class="subtitle">Point of Sale Management System</div>
        </div>

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="{{ form.username.id_for_label }}">Username</label>
                {{ form.username }}
            </div>

            <div class="form-group">
                <label for="{{ form.password.id_for_label }}">Password</label>
                {{ form.password }}
            </div>

            {% if form.errors %}
            <div class="errors">
                <strong>Login Failed</strong><br>
                Invalid username or password. Please try again.
            </div>
            {% endif %}

            <button type="submit" class="btn">Log In</button>
        </form>

        <div class="footer">
            <p>© 2024 POS System<br>
                <a href="/admin/">Admin Panel</a>
            </p>
        </div>
    </div>
</body>

</html>
